<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 주식 평가금액 관리</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f4f5f7;
    color: #1a1a1a;
    padding: 16px;
  }
  .container { max-width: 480px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .header-actions { display: flex; gap: 6px; }
  .icon-btn {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 10px; border-radius: 8px; border: 1px solid #d1d5db;
    background: #fff; font-size: 12px; font-weight: 600; color: #374151;
    cursor: pointer;
  }
  .icon-btn.spin svg { animation: spin 0.6s linear; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .total-card {
    background: #1a1a1a; color: #fff; border-radius: 14px;
    padding: 18px; margin-bottom: 20px;
  }
  .total-card .label { font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
  .total-card .value { font-size: 26px; font-weight: 700; }
  .total-card .updated { font-size: 11px; color: #9ca3af; margin-top: 6px; }

  .section-title { font-size: 14px; font-weight: 700; margin: 0 0 8px; }
  .section { margin-bottom: 22px; }

  .master-card {
    background: #fff; border-radius: 12px; border: 1px solid #e5e7eb;
    padding: 10px 12px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .master-name { font-size: 14px; font-weight: 600; }
  .master-sub { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .badge {
    display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 6px;
    margin-right: 6px; font-weight: 600;
  }
  .badge.stock { background: #e6f1fb; color: #0c447c; }
  .badge.cash { background: #eaf3de; color: #27500a; }
  .badge.fail { background: #fcebeb; color: #791f1f; }
  .master-actions button {
    font-size: 11px; padding: 3px 7px; border-radius: 6px;
    border: 1px solid #e5e7eb; background: #f9fafb; color: #6b7280; margin-left: 4px;
  }

  .add-line-btn {
    width: 100%; margin-top: 4px; padding: 8px; font-size: 12px;
    border-radius: 8px; border: 1px dashed #d1d5db; background: #fafafa; color: #6b7280;
  }

  .broker-block { margin-bottom: 14px; }
  .broker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .broker-name { font-size: 15px; font-weight: 700; }
  .broker-actions button, .account-actions button {
    font-size: 11px; padding: 3px 7px; border-radius: 6px;
    border: 1px solid #e5e7eb; background: #fff; color: #6b7280; margin-left: 4px;
  }

  .account-block {
    background: #fff; border-radius: 12px; border: 1px solid #e5e7eb;
    padding: 12px; margin-bottom: 10px;
  }
  .account-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .account-name { font-size: 13px; font-weight: 600; color: #374151; }
  .account-total { font-size: 13px; font-weight: 600; }

  .holding-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-top: 0.5px solid #f0f0f0;
  }
  .holding-row:first-of-type { border-top: none; }
  .holding-name { font-size: 13px; font-weight: 500; }
  .holding-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
  .holding-value { font-size: 13px; font-weight: 600; text-align: right; }
  .holding-actions button {
    font-size: 11px; padding: 2px 6px; border-radius: 6px;
    border: 1px solid #e5e7eb; background: #fff; color: #9ca3af; margin-left: 4px;
  }

  .add-broker-btn {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: #1a1a1a; color: #fff; font-size: 15px; font-weight: 600;
    margin-top: 4px; cursor: pointer;
  }
  .add-master-btn {
    width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #1a1a1a;
    background: #fff; color: #1a1a1a; font-size: 14px; font-weight: 600;
    margin-top: 4px; cursor: pointer;
  }

  .empty { text-align: center; color: #9ca3af; padding: 24px 0; font-size: 13px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 20px; width: 100%; max-width: 400px; }
  .modal h2 { font-size: 16px; margin: 0 0 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 14px;
    background: #fff;
  }
  .radio-group { display: flex; gap: 10px; }
  .radio-group label {
    flex: 1; display: flex; align-items: center; gap: 6px; font-size: 13px;
    border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 10px; cursor: pointer;
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions button {
    flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; border: 1px solid #d1d5db; background: #fff;
  }
  .modal-actions button.primary { background: #1a1a1a; color: #fff; border: none; }
  .error-text { color: #d92d20; font-size: 12px; margin-top: 4px; display: none; }
  .hint-text { color: #9ca3af; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>내 주식 평가금액</h1>
    <div class="header-actions">
      <button class="icon-btn" onclick="triggerImport()">가져오기</button>
      <button class="icon-btn" onclick="exportData()">내보내기</button>
    </div>
  </div>

  <div class="total-card">
    <div class="label">총 평가금액</div>
    <div class="value" id="grandTotal">0원</div>
    <div class="updated" id="lastUpdated"></div>
  </div>

  <button class="icon-btn" id="refreshBtn" onclick="refreshAll()" style="width:100%; justify-content:center; margin-bottom:20px; padding:10px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    시세 새로고침 (서버에서 조회)
  </button>

  <div class="section">
    <div class="section-title">종목 마스터</div>
    <div id="masterList"></div>
    <div id="masterEmpty" class="empty" style="display:none;">등록된 종목이 없습니다.</div>
    <button class="add-master-btn" onclick="openMasterModal()">+ 종목 마스터에 추가</button>
  </div>

  <div class="section">
    <div class="section-title">증권사 / 계좌</div>
    <div id="brokerList"></div>
    <div id="brokerEmpty" class="empty" style="display:none;">등록된 증권사가 없습니다.</div>
    <button class="add-broker-btn" onclick="openBrokerModal()">+ 증권사 추가</button>
  </div>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none;" onchange="handleImportFile(event)">

<!-- 종목 마스터 추가/수정 모달 -->
<div class="modal-overlay" id="masterModalOverlay">
  <div class="modal">
    <h2 id="masterModalTitle">종목 마스터 추가</h2>
    <div class="field">
      <label>유형</label>
      <div class="radio-group">
        <label><input type="radio" name="masterType" value="stock" checked> 주식</label>
        <label><input type="radio" name="masterType" value="cash"> 현금</label>
      </div>
    </div>
    <div class="field">
      <label>종목명</label>
      <input type="text" id="inputMasterName" placeholder="예: AAPL, 005930.KS, 원화현금">
      <div class="hint-text">시세 조회 정확도를 위해 티커(AAPL, 005930.KS 등) 입력을 권장해요.</div>
      <div class="error-text" id="errMasterName">종목명을 입력하세요</div>
    </div>
    <div class="modal-actions">
      <button onclick="closeModal('masterModalOverlay')">취소</button>
      <button class="primary" onclick="saveMaster()">저장</button>
    </div>
  </div>
</div>

<!-- 증권사 추가 모달 -->
<div class="modal-overlay" id="brokerModalOverlay">
  <div class="modal">
    <h2>증권사 추가</h2>
    <div class="field">
      <label>증권사명</label>
      <input type="text" id="inputBrokerName" placeholder="예: 미래에셋증권">
      <div class="error-text" id="errBrokerName">증권사명을 입력하세요</div>
    </div>
    <div class="modal-actions">
      <button onclick="closeModal('brokerModalOverlay')">취소</button>
      <button class="primary" onclick="saveBroker()">저장</button>
    </div>
  </div>
</div>

<!-- 계좌 추가 모달 -->
<div class="modal-overlay" id="accountModalOverlay">
  <div class="modal">
    <h2>계좌 추가</h2>
    <div class="field">
      <label>계좌명</label>
      <input type="text" id="inputAccountName" placeholder="예: 연금저축계좌">
      <div class="error-text" id="errAccountName">계좌명을 입력하세요</div>
    </div>
    <div class="modal-actions">
      <button onclick="closeModal('accountModalOverlay')">취소</button>
      <button class="primary" onclick="saveAccount()">저장</button>
    </div>
  </div>
</div>

<!-- 계좌에 종목 불러오기 모달 -->
<div class="modal-overlay" id="holdingModalOverlay">
  <div class="modal">
    <h2>종목 불러오기</h2>
    <div class="field">
      <label>종목 선택</label>
      <select id="inputHoldingStock"></select>
      <div class="hint-text" id="noMasterHint" style="display:none;">먼저 종목 마스터에 종목을 추가해주세요.</div>
    </div>
    <div class="field">
      <label id="holdingQtyLabel">보유 수량</label>
      <input type="number" id="inputHoldingQty" placeholder="예: 10" min="0" step="any">
      <div class="error-text" id="errHoldingQty">올바른 값을 입력하세요</div>
    </div>
    <div class="modal-actions">
      <button onclick="closeModal('holdingModalOverlay')">취소</button>
      <button class="primary" onclick="saveHolding()">저장</button>
    </div>
  </div>
</div>

<script>
let masterStocks = [];   // { id, name, type: 'stock'|'cash', curPrice, fetchStatus: 'ok'|'fail'|'none' }
let brokers = [];        // { id, name, accounts: [{ id, name, holdings: [{ id, stockId, qty }] }] }

let pendingBrokerId = null;
let pendingAccountId = null;

const fmt = (n) => Math.round(n || 0).toLocaleString('ko-KR') + '원';

function loadData() {
  try { masterStocks = JSON.parse(localStorage.getItem('portfolio:masterStocks') || '[]'); }
  catch (e) { masterStocks = []; }
  try { brokers = JSON.parse(localStorage.getItem('portfolio:brokers') || '[]'); }
  catch (e) { brokers = []; }
  render();
}

function persistMaster() { localStorage.setItem('portfolio:masterStocks', JSON.stringify(masterStocks)); }
function persistBrokers() { localStorage.setItem('portfolio:brokers', JSON.stringify(brokers)); }

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ---------- 내보내기 / 가져오기 ----------
function exportData() {
  const payload = { masterStocks, brokers, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `portfolio-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function triggerImport() { document.getElementById('importFile').click(); }

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.masterStocks) || !Array.isArray(data.brokers)) {
        alert('올바른 백업 파일이 아닙니다.');
        return;
      }
      masterStocks = data.masterStocks;
      brokers = data.brokers;
      persistMaster();
      persistBrokers();
      render();
    } catch (e) {
      alert('파일을 읽을 수 없습니다.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ---------- 종목 마스터 ----------
function openMasterModal() {
  document.getElementById('masterModalTitle').textContent = '종목 마스터 추가';
  document.getElementById('inputMasterName').value = '';
  document.getElementById('errMasterName').style.display = 'none';
  document.querySelector('input[name="masterType"][value="stock"]').checked = true;
  document.getElementById('masterModalOverlay').classList.add('open');
}

function saveMaster() {
  const name = document.getElementById('inputMasterName').value.trim();
  const type = document.querySelector('input[name="masterType"]:checked').value;
  if (!name) { document.getElementById('errMasterName').style.display = 'block'; return; }
  document.getElementById('errMasterName').style.display = 'none';

  masterStocks.push({ id: Date.now().toString(), name, type, curPrice: type === 'cash' ? 1 : 0, fetchStatus: 'none' });
  persistMaster();
  closeModal('masterModalOverlay');
  render();
}

function deleteMaster(id) {
  masterStocks = masterStocks.filter(x => x.id !== id);
  brokers.forEach(b => b.accounts.forEach(a => {
    a.holdings = a.holdings.filter(h => h.stockId !== id);
  }));
  persistMaster();
  persistBrokers();
  render();
}

// ---------- 시세 새로고침 (서버 API 호출) ----------
async function refreshAll() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spin');

  const stockItems = masterStocks.filter(s => s.type === 'stock');
  await Promise.all(stockItems.map(async (s) => {
    try {
      const res = await fetch(`/api/price?symbol=${encodeURIComponent(s.name)}`);
      if (!res.ok) throw new Error('lookup failed');
      const data = await res.json();
      if (typeof data.price === 'number') {
        s.curPrice = data.price;
        s.fetchStatus = 'ok';
      } else {
        s.fetchStatus = 'fail';
      }
    } catch (e) {
      s.fetchStatus = 'fail';
    }
  }));

  persistMaster();
  btn.classList.remove('spin');
  render();
  document.getElementById('lastUpdated').textContent =
    '마지막 조회: ' + new Date().toLocaleString('ko-KR', { hour: '2-digit', minute: '2-digit', month: 'numeric', day: 'numeric' });
}

// ---------- 증권사 ----------
function openBrokerModal() {
  document.getElementById('inputBrokerName').value = '';
  document.getElementById('errBrokerName').style.display = 'none';
  document.getElementById('brokerModalOverlay').classList.add('open');
}

function saveBroker() {
  const name = document.getElementById('inputBrokerName').value.trim();
  if (!name) { document.getElementById('errBrokerName').style.display = 'block'; return; }
  brokers.push({ id: Date.now().toString(), name, accounts: [] });
  persistBrokers();
  closeModal('brokerModalOverlay');
  render();
}

function deleteBroker(id) {
  brokers = brokers.filter(b => b.id !== id);
  persistBrokers();
  render();
}

// ---------- 계좌 ----------
function openAccountModal(brokerId) {
  pendingBrokerId = brokerId;
  document.getElementById('inputAccountName').value = '';
  document.getElementById('errAccountName').style.display = 'none';
  document.getElementById('accountModalOverlay').classList.add('open');
}

function saveAccount() {
  const name = document.getElementById('inputAccountName').value.trim();
  if (!name) { document.getElementById('errAccountName').style.display = 'block'; return; }
  const broker = brokers.find(b => b.id === pendingBrokerId);
  if (broker) {
    broker.accounts.push({ id: Date.now().toString(), name, holdings: [] });
    persistBrokers();
  }
  closeModal('accountModalOverlay');
  render();
}

function deleteAccount(brokerId, accountId) {
  const broker = brokers.find(b => b.id === brokerId);
  if (broker) {
    broker.accounts = broker.accounts.filter(a => a.id !== accountId);
    persistBrokers();
    render();
  }
}

// ---------- 계좌에 종목 불러오기 ----------
function openHoldingModal(brokerId, accountId) {
  pendingBrokerId = brokerId;
  pendingAccountId = accountId;
  document.getElementById('inputHoldingQty').value = '';
  document.getElementById('errHoldingQty').style.display = 'none';

  const broker = brokers.find(b => b.id === brokerId);
  const account = broker.accounts.find(a => a.id === accountId);
  const usedIds = account.holdings.map(h => h.stockId);
  const available = masterStocks.filter(s => !usedIds.includes(s.id));

  const select = document.getElementById('inputHoldingStock');
  select.innerHTML = '';
  const hint = document.getElementById('noMasterHint');
  if (available.length === 0) {
    hint.style.display = 'block';
    select.style.display = 'none';
  } else {
    hint.style.display = 'none';
    select.style.display = 'block';
    available.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.type === 'cash' ? `${s.name} (현금)` : `${s.name} (${fmt(s.curPrice)})`;
      select.appendChild(opt);
    });
  }

  select.onchange = updateHoldingLabel;
  updateHoldingLabel();

  document.getElementById('holdingModalOverlay').classList.add('open');
}

function updateHoldingLabel() {
  const select = document.getElementById('inputHoldingStock');
  const label = document.getElementById('holdingQtyLabel');
  if (select.style.display === 'none' || !select.value) { label.textContent = '보유 수량'; return; }
  const stock = masterStocks.find(s => s.id === select.value);
  label.textContent = stock && stock.type === 'cash' ? '보유 금액 (원)' : '보유 수량 (주)';
}

function saveHolding() {
  const select = document.getElementById('inputHoldingStock');
  if (select.style.display === 'none') { closeModal('holdingModalOverlay'); return; }
  const stockId = select.value;
  const qty = parseFloat(document.getElementById('inputHoldingQty').value);
  if (!stockId || isNaN(qty) || qty <= 0) {
    document.getElementById('errHoldingQty').style.display = 'block';
    return;
  }
  document.getElementById('errHoldingQty').style.display = 'none';

  const broker = brokers.find(b => b.id === pendingBrokerId);
  const account = broker.accounts.find(a => a.id === pendingAccountId);
  account.holdings.push({ id: Date.now().toString(), stockId, qty });
  persistBrokers();
  closeModal('holdingModalOverlay');
  render();
}

function deleteHolding(brokerId, accountId, holdingId) {
  const broker = brokers.find(b => b.id === brokerId);
  const account = broker.accounts.find(a => a.id === accountId);
  account.holdings = account.holdings.filter(h => h.id !== holdingId);
  persistBrokers();
  render();
}

// ---------- 렌더 ----------
function stockById(id) { return masterStocks.find(s => s.id === id); }

function renderMasterList() {
  const list = document.getElementById('masterList');
  const empty = document.getElementById('masterEmpty');
  list.innerHTML = '';
  empty.style.display = masterStocks.length === 0 ? 'block' : 'none';

  masterStocks.forEach(s => {
    const div = document.createElement('div');
    div.className = 'master-card';
    const typeBadge = s.type === 'cash'
      ? '<span class="badge cash">현금</span>'
      : '<span class="badge stock">주식</span>';
    const statusBadge = s.type === 'stock' && s.fetchStatus === 'fail'
      ? '<span class="badge fail">조회 실패</span>' : '';
    const priceText = s.type === 'cash' ? '' : `현재가 ${fmt(s.curPrice)}`;
    div.innerHTML = `
      <div>
        <div class="master-name">${typeBadge}${statusBadge}${s.name}</div>
        <div class="master-sub">${priceText}</div>
      </div>
      <div class="master-actions">
        <button onclick="deleteMaster('${s.id}')">삭제</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function render() {
  renderMasterList();

  const list = document.getElementById('brokerList');
  const empty = document.getElementById('brokerEmpty');
  list.innerHTML = '';
  empty.style.display = brokers.length === 0 ? 'block' : 'none';

  let grandTotal = 0;

  brokers.forEach(broker => {
    let brokerTotal = 0;
    const brokerDiv = document.createElement('div');
    brokerDiv.className = 'broker-block';

    const accountsHtml = broker.accounts.map(account => {
      let accountTotal = 0;
      const holdingsHtml = account.holdings.map(h => {
        const stock = stockById(h.stockId);
        if (!stock) return '';
        const value = stock.type === 'cash' ? h.qty : h.qty * stock.curPrice;
        accountTotal += value;
        const sub = stock.type === 'cash' ? '현금' : `${h.qty}주 × ${fmt(stock.curPrice)}`;
        return `
          <div class="holding-row">
            <div>
              <div class="holding-name">${stock.name}</div>
              <div class="holding-sub">${sub}</div>
            </div>
            <div style="display:flex; align-items:center;">
              <div class="holding-value">${fmt(value)}</div>
              <div class="holding-actions">
                <button onclick="deleteHolding('${broker.id}','${account.id}','${h.id}')">제거</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      brokerTotal += accountTotal;

      return `
        <div class="account-block">
          <div class="account-header">
            <div class="account-name">${account.name}</div>
            <div style="display:flex; align-items:center;">
              <div class="account-total">${fmt(accountTotal)}</div>
              <div class="account-actions">
                <button onclick="deleteAccount('${broker.id}','${account.id}')">계좌삭제</button>
              </div>
            </div>
          </div>
          ${holdingsHtml}
          <button class="add-line-btn" onclick="openHoldingModal('${broker.id}','${account.id}')">+ 종목 불러오기</button>
        </div>
      `;
    }).join('');

    grandTotal += brokerTotal;

    brokerDiv.innerHTML = `
      <div class="broker-header">
        <div class="broker-name">${broker.name}</div>
        <div style="display:flex; align-items:center;">
          <div class="broker-actions">
            <button onclick="openAccountModal('${broker.id}')">계좌추가</button>
            <button onclick="deleteBroker('${broker.id}')">증권사삭제</button>
          </div>
        </div>
      </div>
      ${accountsHtml}
    `;
    list.appendChild(brokerDiv);
  });

  document.getElementById('grandTotal').textContent = fmt(grandTotal);
}

loadData();
</script>
</body>
</html>
